name: "Daily GitHub Repository Intelligence Sync"

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: github-sync-pipeline
  cancel-in-progress: false

jobs:
  sync_and_enrich:
    name: "Sync Telemetry & AI Taxonomy Enrichment"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Stage 1: Adaptive Bisection Telemetry Ingestion"
        id: stage_ingest
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PROVIDER: ${{ secrets.DB_PROVIDER }} # "supabase" or "turso"
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/ingest_telemetry.py --min-stars 2000

      - name: "Stage 2: Multi-Provider AI Taxonomy & Vector Enrichment"
        id: stage_enrich
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PROVIDER: ${{ secrets.DB_PROVIDER }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          BATCH_LIMIT: "1000"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/enrich_taxonomy.py --batch-size 1000

      - name: "Error Handling & Diagnostic Alert"
        if: failure()
        run: |
          echo "::error title=Pipeline Failure::Daily sync failed. Check individual step logs."
          echo "## ❌ GitHub Intelligence Sync Pipeline Failure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run ID** | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Attempt** | \`${{ github.run_attempt }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 1 (Ingestion)** | \`${{ steps.stage_ingest.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 2 (Enrichment)** | \`${{ steps.stage_enrich.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommended Triage Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify \`GITHUB_TOKEN\` / \`GH_PAT_TOKEN\` rate limits and validity." >> $GITHUB_STEP_SUMMARY
          echo "2. Check database connectivity and credentials for provider \`${{ secrets.DB_PROVIDER }}\`." >> $GITHUB_STEP_SUMMARY
          echo "3. Inspect LLM provider quotas (Groq, Gemini, Cerebras, OpenRouter) for 429 throttling." >> $GITHUB_STEP_SUMMARY

      - name: "Pipeline Success Summary"
        if: success()
        run: |
          echo "## ✅ GitHub Intelligence Sync Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run ID** | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 1 Status** | \`Success\` (Repositories >= 2,000 stars refreshed) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage 2 Status** | \`Success\` (Enrichment batch processed) |" >> $GITHUB_STEP_SUMMARY
